<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mari Belajar Adab – Membaca Al-Qur'an</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;0,900;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&family=Amiri:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
<style>
  :root {
    --gold: #C9973A;
    --gold-light: #F0C060;
    --gold-bright: #FFD700;
    --gold-glow: rgba(201, 151, 58, 0.7);
    --dark: #0a0805;
    --glass-bg: rgba(10, 6, 2, 0.72);
    --glass-border: rgba(201, 151, 58, 0.55);
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html { scroll-behavior: smooth; }

  body {
    font-family: 'Cormorant Garamond', serif;
    background: var(--dark);
    color: #e8d5b0;
    overflow-x: hidden;
    min-height: 100vh;
  }

  /* ===== SHARED BG ===== */
  .page {
    min-height: 100vh;
    position: relative;
    display: none;
  }
  .page.active { display: flex; flex-direction: column; }

  .bg-layer {
    position: fixed;
    inset: 0;
    background-image: url('https://bimamedia-cms.sg-sin-1.linodeobjects.com/sarungbhs.co.id/2025/03/03/l-surat-penenang-hati-yang-terdapat-dalam-alquran-erejpg20250303140703.jpeg');
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
    z-index: -2;
  }
  .bg-overlay {
    position: fixed;
    inset: 0;
    background: linear-gradient(160deg, rgba(5,3,1,0.82) 0%, rgba(15,9,3,0.75) 50%, rgba(5,3,1,0.88) 100%);
    z-index: -1;
  }

  /* ===== PARTICLES ===== */
  #particles {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
  }

  /* ===== PAGE 1 – LANDING ===== */
  #page1 {
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 2rem;
    position: relative;
  }

  .landing-inner {
    position: relative;
    z-index: 1;
    animation: fadeInUp 1.2s ease both;
  }
  @keyframes fadeInUp {
    from { opacity: 0; transform: translateY(40px); }
    to   { opacity: 1; transform: translateY(0); }
  }

  .ornament {
    font-size: 2rem;
    color: var(--gold);
    letter-spacing: 1rem;
    opacity: 0.7;
    animation: fadeInUp 1.2s 0.2s ease both;
    text-shadow: 0 0 18px var(--gold-glow);
  }

  .main-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(3rem, 10vw, 7rem);
    font-weight: 900;
    line-height: 1;
    margin: 1rem 0 0.5rem;
    background: linear-gradient(135deg, var(--gold-light) 0%, var(--gold-bright) 40%, var(--gold) 70%, #a0722a 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-shadow: none;
    filter: drop-shadow(0 0 25px rgba(255,215,0,0.45));
    animation: fadeInUp 1.2s 0.3s ease both;
  }

  .main-subtitle {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.4rem, 4vw, 2.4rem);
    font-style: italic;
    color: var(--gold-light);
    letter-spacing: 0.15em;
    margin-bottom: 0.6rem;
    animation: fadeInUp 1.2s 0.4s ease both;
  }

  .author-line {
    font-size: clamp(0.85rem, 2vw, 1.1rem);
    color: rgba(240,192,96,0.65);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    margin-bottom: 3rem;
    animation: fadeInUp 1.2s 0.5s ease both;
  }

  .btn-start {
    display: inline-block;
    padding: 1.1rem 3.5rem;
    font-family: 'Playfair Display', serif;
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: 0.25em;
    text-transform: uppercase;
    color: var(--dark);
    background: linear-gradient(135deg, var(--gold-light), var(--gold-bright), var(--gold));
    border: none;
    border-radius: 4px;
    cursor: pointer;
    position: relative;
    animation: fadeInUp 1.2s 0.65s ease both;
    transition: all 0.35s ease;
    box-shadow: 0 0 28px rgba(255,215,0,0.35), 0 4px 20px rgba(0,0,0,0.5);
  }
  .btn-start::before {
    content: '';
    position: absolute;
    inset: -3px;
    border-radius: 6px;
    background: linear-gradient(135deg, var(--gold-bright), transparent, var(--gold-bright));
    z-index: -1;
    opacity: 0;
    transition: opacity 0.35s;
  }
  .btn-start:hover {
    transform: scale(1.07);
    box-shadow: 0 0 55px rgba(255,215,0,0.75), 0 4px 30px rgba(0,0,0,0.6);
  }
  .btn-start:hover::before { opacity: 1; }

  /* ===== PAGE 2 ===== */
  #page2 { flex-direction: column; position: relative; z-index: 1; }

  /* HEADER */
  .site-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0.9rem 2.5rem;
    background: rgba(8,5,2,0.85);
    border-bottom: 1px solid var(--glass-border);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    box-shadow: 0 2px 30px rgba(201,151,58,0.18);
    position: sticky;
    top: 0;
    z-index: 100;
  }

  .header-side {
    display: flex;
    align-items: center;
    gap: 0.85rem;
  }
  .header-side img {
    height: 52px;
    width: 52px;
    object-fit: contain;
    border-radius: 50%;
    border: 1.5px solid var(--gold);
    box-shadow: 0 0 12px var(--gold-glow);
  }
  .header-side .inst-name {
    font-family: 'Playfair Display', serif;
    font-size: 0.95rem;
    font-weight: 700;
    color: var(--gold-light);
    line-height: 1.25;
    text-shadow: 0 0 10px var(--gold-glow);
  }
  .header-right { text-align: right; }
  .header-right .inst-name { text-align: right; }

  /* MAIN CONTENT */
  .page2-body {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 4rem 2rem;
    text-align: center;
    position: relative;
    z-index: 1;
  }

  .page2-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.8rem, 5vw, 3.5rem);
    font-weight: 900;
    background: linear-gradient(135deg, var(--gold-light), var(--gold-bright), var(--gold));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    filter: drop-shadow(0 0 18px rgba(255,215,0,0.4));
    margin-bottom: 0.5rem;
    animation: fadeInUp 0.8s ease both;
  }

  .page2-sub {
    font-size: 1.1rem;
    color: rgba(240,192,96,0.6);
    letter-spacing: 0.18em;
    text-transform: uppercase;
    margin-bottom: 3rem;
    animation: fadeInUp 0.8s 0.1s ease both;
  }

  .menu-grid {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
    justify-content: center;
    animation: fadeInUp 0.8s 0.2s ease both;
  }

  .menu-btn {
    padding: 1.2rem 2.8rem;
    font-family: 'Playfair Display', serif;
    font-size: 1.15rem;
    font-weight: 700;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--gold-light);
    background: var(--glass-bg);
    border: 1.5px solid var(--glass-border);
    border-radius: 6px;
    cursor: pointer;
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    box-shadow: 0 0 20px rgba(201,151,58,0.2), inset 0 1px 0 rgba(255,215,0,0.1);
    transition: all 0.35s cubic-bezier(0.23,1,0.32,1);
    position: relative;
    overflow: hidden;
    min-width: 200px;
  }
  .menu-btn::after {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, rgba(255,215,0,0.08), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .menu-btn:hover {
    transform: scale(1.07) translateY(-3px);
    border-color: var(--gold-bright);
    box-shadow: 0 0 45px rgba(255,215,0,0.55), 0 8px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,215,0,0.2);
    color: var(--gold-bright);
    text-shadow: 0 0 12px rgba(255,215,0,0.7);
  }
  .menu-btn:hover::after { opacity: 1; }

  /* ===== GAME BUTTON — khusus style beda ===== */
  .menu-btn-game {
    background: linear-gradient(135deg, rgba(20,10,2,0.92), rgba(10,6,2,0.88));
    border-color: rgba(255, 180, 0, 0.8);
    color: var(--gold-bright);
    text-shadow: 0 0 10px rgba(255,215,0,0.5);
    box-shadow: 0 0 30px rgba(255,180,0,0.3), inset 0 1px 0 rgba(255,215,0,0.15);
  }
  .menu-btn-game:hover {
    background: linear-gradient(135deg, rgba(255,215,0,0.15), rgba(201,151,58,0.08));
    box-shadow: 0 0 60px rgba(255,215,0,0.7), 0 8px 35px rgba(0,0,0,0.6), inset 0 1px 0 rgba(255,215,0,0.25);
  }

  /* ===== DISKUSI BUTTON — accent warna berbeda ===== */
  .menu-btn-diskusi {
    background: linear-gradient(135deg, rgba(5,15,20,0.92), rgba(2,10,14,0.88));
    border-color: rgba(100, 200, 255, 0.45);
    color: #a8d8f0;
    text-shadow: 0 0 10px rgba(100,200,255,0.4);
    box-shadow: 0 0 25px rgba(100,200,255,0.15), inset 0 1px 0 rgba(100,200,255,0.1);
  }
  .menu-btn-diskusi:hover {
    border-color: rgba(150, 220, 255, 0.85);
    color: #c8eaff;
    text-shadow: 0 0 14px rgba(150,220,255,0.7);
    box-shadow: 0 0 50px rgba(100,200,255,0.5), 0 8px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(150,220,255,0.2);
    background: linear-gradient(135deg, rgba(100,200,255,0.1), rgba(50,150,200,0.05));
  }

  /* ===== MODAL (materi) ===== */
  .modal-overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    z-index: 500;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.5rem;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.4s ease;
  }
  .modal-overlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .modal-box {
    background: rgba(8,5,2,0.88);
    border: 1.5px solid var(--glass-border);
    border-radius: 12px;
    max-width: 720px;
    width: 100%;
    max-height: 85vh;
    display: flex;
    flex-direction: column;
    box-shadow: 0 0 60px rgba(201,151,58,0.35), 0 0 120px rgba(255,215,0,0.12), inset 0 1px 0 rgba(255,215,0,0.12);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    transform: scale(0.88) translateY(30px);
    transition: transform 0.4s cubic-bezier(0.23,1,0.32,1);
    position: relative;
    overflow: hidden;
  }
  .modal-box::before {
    content: '';
    position: absolute;
    top: 0; left: 0; right: 0;
    height: 2px;
    background: linear-gradient(90deg, transparent, var(--gold-bright), transparent);
    animation: glowLine 2.5s linear infinite;
  }
  @keyframes glowLine {
    0%   { background-position: -200% center; }
    100% { background-position: 200% center; }
  }
  .modal-overlay.open .modal-box {
    transform: scale(1) translateY(0);
  }

  .modal-header {
    padding: 1.5rem 1.8rem 1rem;
    border-bottom: 1px solid rgba(201,151,58,0.25);
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 1rem;
  }
  .modal-title {
    font-family: 'Playfair Display', serif;
    font-size: clamp(1.1rem, 3vw, 1.55rem);
    font-weight: 700;
    color: var(--gold-bright);
    text-shadow: 0 0 16px rgba(255,215,0,0.45);
    line-height: 1.3;
  }
  .modal-close {
    background: transparent;
    border: 1px solid rgba(201,151,58,0.4);
    color: var(--gold);
    font-size: 1.3rem;
    width: 38px;
    height: 38px;
    border-radius: 50%;
    cursor: pointer;
    flex-shrink: 0;
    display: flex; align-items: center; justify-content: center;
    transition: all 0.3s;
  }
  .modal-close:hover {
    background: rgba(255,215,0,0.12);
    border-color: var(--gold-bright);
    box-shadow: 0 0 14px rgba(255,215,0,0.4);
    color: var(--gold-bright);
  }

  .modal-body {
    padding: 1.5rem 1.8rem 2rem;
    overflow-y: auto;
    font-size: 1.05rem;
    line-height: 1.85;
    color: #dcc98a;
    scrollbar-width: thin;
    scrollbar-color: var(--gold) rgba(255,255,255,0.05);
  }
  .modal-body::-webkit-scrollbar { width: 6px; }
  .modal-body::-webkit-scrollbar-track { background: rgba(255,255,255,0.04); border-radius: 3px; }
  .modal-body::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 3px; }

  .arabic-text {
    font-family: 'Amiri', serif;
    font-size: clamp(1.4rem, 4vw, 2rem);
    color: var(--gold-light);
    text-align: center;
    direction: rtl;
    line-height: 2.2;
    margin: 1.5rem 0 0.5rem;
    text-shadow: 0 0 12px rgba(240,192,96,0.3);
    padding: 1rem 1.2rem;
    background: rgba(201,151,58,0.07);
    border-left: 3px solid var(--gold);
    border-right: 3px solid var(--gold);
    border-radius: 6px;
  }

  .ayat-ref {
    font-style: italic;
    font-size: 0.92rem;
    color: rgba(240,192,96,0.65);
    text-align: center;
    margin-bottom: 1.2rem;
  }

  .modal-body p { margin-bottom: 0.9rem; }

  .adab-list {
    list-style: none;
    padding: 0;
    margin: 0.5rem 0;
  }
  .adab-list li {
    display: flex;
    gap: 0.8rem;
    align-items: flex-start;
    padding: 0.65rem 0.8rem;
    border-bottom: 1px solid rgba(201,151,58,0.12);
    transition: background 0.25s;
  }
  .adab-list li:hover { background: rgba(201,151,58,0.06); border-radius: 6px; }
  .adab-list li:last-child { border-bottom: none; }
  .list-num {
    font-family: 'Playfair Display', serif;
    color: var(--gold);
    font-weight: 700;
    font-size: 1rem;
    min-width: 28px;
    text-shadow: 0 0 8px var(--gold-glow);
  }

  .divider {
    height: 1px;
    background: linear-gradient(90deg, transparent, var(--gold), transparent);
    margin: 1.2rem 0;
    opacity: 0.4;
  }

  /* ===== DISKUSI FULLSCREEN OVERLAY ===== */
  #diskusiOverlay {
    position: fixed;
    inset: 0;
    z-index: 900;
    background: rgba(0,0,0,0.96);
    display: flex;
    align-items: center;
    justify-content: center;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.45s ease;
    flex-direction: column;
  }
  #diskusiOverlay.open {
    opacity: 1;
    pointer-events: all;
  }

  .diskusi-close {
    position: absolute;
    top: 1.5rem;
    right: 1.5rem;
    background: rgba(8,5,2,0.85);
    border: 1.5px solid rgba(100,200,255,0.5);
    color: #a8d8f0;
    font-size: 1.4rem;
    width: 46px;
    height: 46px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: all 0.3s;
    z-index: 10;
    box-shadow: 0 0 18px rgba(100,200,255,0.25);
  }
  .diskusi-close:hover {
    background: rgba(100,200,255,0.15);
    border-color: #7dd8ff;
    color: #c8eaff;
    box-shadow: 0 0 30px rgba(100,200,255,0.5);
    transform: scale(1.1);
  }

  .diskusi-img-wrapper {
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 3.5rem 2rem 2rem;
  }

  .diskusi-img-wrapper img {
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
    border-radius: 10px;
    box-shadow: 0 0 60px rgba(100,200,255,0.2), 0 0 120px rgba(100,200,255,0.08);
    transform: scale(0.9);
    transition: transform 0.5s cubic-bezier(0.23,1,0.32,1);
  }
  #diskusiOverlay.open .diskusi-img-wrapper img {
    transform: scale(1);
  }

  .diskusi-label {
    position: absolute;
    bottom: 1.8rem;
    left: 50%;
    transform: translateX(-50%);
    font-family: 'Playfair Display', serif;
    font-size: 0.9rem;
    color: rgba(168,216,240,0.5);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  /* ===== FOOTER ===== */
  .site-footer {
    text-align: center;
    padding: 1rem;
    font-size: 0.8rem;
    color: rgba(201,151,58,0.35);
    letter-spacing: 0.12em;
    border-top: 1px solid rgba(201,151,58,0.12);
    position: relative;
    z-index: 1;
  }

  /* ===== RESPONSIVE ===== */
  @media (max-width: 600px) {
    .site-header { padding: 0.7rem 1rem; }
    .header-side img { height: 40px; width: 40px; }
    .header-side .inst-name { font-size: 0.78rem; }
    .menu-btn { min-width: 160px; padding: 1rem 1.8rem; font-size: 1rem; }
    .modal-box { max-height: 90vh; }
    .modal-header { padding: 1.2rem 1.2rem 0.8rem; }
    .modal-body { padding: 1rem 1.2rem 1.5rem; font-size: 0.97rem; }
  }
</style>
</head>

<!-- ===== PAGE 1 ===== -->

<script>
/* ===== PARTICLES ===== */
(function() {
  const canvas = document.getElementById('particles');
  const ctx = canvas.getContext('2d');
  let particles = [];

  function resize() {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
  resize();
  window.addEventListener('resize', resize);

  function createParticle() {
    return {
      x: Math.random() * canvas.width,
      y: canvas.height + 10,
      size: Math.random() * 2.5 + 0.5,
      speed: Math.random() * 0.6 + 0.2,
      opacity: 0,
      maxOp: Math.random() * 0.5 + 0.2,
      fadeIn: true,
    };
  }

  for (let i = 0; i < 40; i++) {
    particles.push(createParticle());
    particles[i].y = Math.random() * canvas.height;
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    particles.forEach((p, i) => {
      p.y -= p.speed;
      if (p.fadeIn) {
        p.opacity += 0.008;
        if (p.opacity >= p.maxOp) p.fadeIn = false;
      } else {
        p.opacity -= 0.003;
      }
      if (p.y < -10 || p.opacity < 0) {
        particles[i] = createParticle();
        return;
      }
      ctx.beginPath();
      ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,215,0,${p.opacity})`;
      ctx.shadowBlur = 8;
      ctx.shadowColor = 'rgba(255,215,0,0.7)';
      ctx.fill();
      ctx.shadowBlur = 0;
    });
    requestAnimationFrame(draw);
  }
  draw();
})();

function openModal(key) {

  overlay.classList.add('open');
  document.body.style.overflow = 'hidden';
}

function closeModal() {
  document.getElementById('modalOverlay').classList.remove('open');
  document.body.style.overflow = '';
}

function closeModalOutside(e) {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
}
